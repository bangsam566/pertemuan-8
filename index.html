<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout HTML5 - Iframe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Latar belakang gambar */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://global.ac.id/wp-content/uploads/2021/11/logo-global-institute-type-2.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.15; /* Atur ketebalan gambar */
      z-index: -1;
    }

    nav {
      width: 25%;
      background: rgba(255, 255, 255, 0.85);
      padding: 30px 20px;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
    }

    nav h3 {
      margin-bottom: 20px;
      font-size: 22px;
      color: #444;
      border-bottom: 2px solid #aaa;
      padding-bottom: 10px;
    }

    nav a {
      display: block;
      margin: 15px 0;
      text-decoration: none;
      color: #333;
      padding: 10px;
      border-radius: 8px;
      transition: background-color 0.3s, color 0.3s;
    }

    nav a:hover {
      background-color: #007BFF;
      color: #fff;
    }

    iframe {
      width: 75%;
      border: none;
      height: 100vh;
      background-color: white;
    }
  </style>
</head>
<body>

  <nav>
    <h3>Menu</h3>
    <a href="konten.html" target="contentFrame">Beranda</a>
    <a href="profile.html" target="contentFrame">Profil</a>
    <a href="contact.html" target="contentFrame">Kontak</a>
  </nav>

  <iframe name="contentFrame" src="konten.html"></iframe>

</body>
</html>
